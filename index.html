<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>机元镜像 · 三维模型库</title>
<style>
  :root{
    --bg:#0d0f14; --bg2:#11141b; --card:#171b24; --card2:#1d222d;
    --line:#262c38; --text:#e6e9ef; --muted:#8b93a3; --accent:#38bdf8; --accent2:#f59e0b;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 80% -10%,rgba(56,189,248,.10),transparent 60%),
      radial-gradient(900px 500px at -10% 10%,rgba(245,158,11,.08),transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    min-height:100vh; padding:0 0 56px;
  }
  header{
    max-width:1120px; margin:0 auto; padding:48px 24px 28px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:14px}
  .logo{
    width:46px;height:46px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,var(--accent),#6366f1);
    display:grid;place-items:center;font-weight:800;font-size:20px;color:#04121f;
    box-shadow:0 6px 20px rgba(56,189,248,.35);
  }
  h1{font-size:26px;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .count{
    color:var(--muted);font-size:13px;border:1px solid var(--line);
    padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.02);
  }
  main{max-width:1120px;margin:0 auto;padding:8px 24px}
  .grid{
    display:grid;gap:20px;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  }
  .card{
    background:linear-gradient(180deg,var(--card),var(--card2));
    border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-4px);border-color:rgba(56,189,248,.55);box-shadow:0 14px 34px rgba(0,0,0,.45)}
  .thumb{position:relative;aspect-ratio:16/10;background:#0b0e13;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .ph{
    position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);
    background:repeating-linear-gradient(45deg,#0e1219,#0e1219 12px,#121722 12px,#121722 24px);
    font-size:13px;gap:8px;text-align:center;padding:18px;
  }
  .badge{
    position:absolute;top:10px;left:10px;font-size:12px;padding:4px 10px;border-radius:999px;
    background:rgba(13,15,20,.72);border:1px solid var(--line);backdrop-filter:blur(4px);color:#cfe9ff;
  }
  .body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
  .name{font-size:16px;font-weight:700;line-height:1.35}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.02)}
  .tag.fmt{color:#ffd9a3;border-color:rgba(245,158,11,.4)}
  .code{font-size:13px;color:var(--muted)}
  .code b{color:var(--accent2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}
  .btn{
    margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    text-decoration:none;color:#04121f;font-weight:700;font-size:14px;
    background:linear-gradient(135deg,var(--accent),#22d3ee);
    padding:11px 14px;border-radius:10px;transition:filter .15s ease;
  }
  .btn:hover{filter:brightness(1.08)}
  footer{
    max-width:1120px;margin:40px auto 0;padding:20px 24px;color:var(--muted);font-size:12.5px;line-height:1.7;
    border-top:1px solid var(--line);
  }
  footer b{color:#cdd3df}
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">机</div>
      <div>
        <h1>三维模型库</h1>
        <div class="sub">机元镜像 · 自动化设备三维模型分享</div>
      </div>
    </div>
    <div class="count" id="count">共 6 个模型</div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <p><b>版权与免责声明：</b>本页部分三维模型来源于互联网，仅用于学习交流与个人共享，相关权利归原作者所有。如涉及侵权，请联系维护人及时下架。请于下载后 24 小时内删除，由此产生的任何使用后果由使用者自行承担。</p>
  </footer>

<script>
  const models = [
    { name:"电池自动焊锡设备", fmt:"待补充", platform:"百度网盘", code:"bi33",
      url:"https://pan.baidu.com/s/17XPuTToQvsIJGyHswVGiJw?pwd=bi33", img:"assets/th1.png" },
    { name:"电池包检测自动上下料", fmt:"待补充", platform:"百度网盘", code:"bi22",
      url:"https://pan.baidu.com/s/1cYYgjNgMh67li1Ish6fBhg?pwd=bi22", img:"assets/th2.png" },
    { name:"智能分拣设备", fmt:"待补充", platform:"百度网盘", code:"bi11",
      url:"https://pan.baidu.com/s/1cOmCpZeYMgmpR4RhVywxSg?pwd=bi11", img:"assets/th3.png" },
    { name:"小球自动装罐机", fmt:"待补充", platform:"百度网盘", code:"bi11",
      url:"https://pan.baidu.com/s/1kzv5DyBhQAwBsHHyd_Fa_w?pwd=bi11", img:"assets/th_ball_can.png" },
    { name:"小球凸轮搬运", fmt:"待补充", platform:"百度网盘", code:"bi11",
      url:"https://pan.baidu.com/s/1vkaHbW3eT7SaYGDwMbqE4Q?pwd=bi11", img:"assets/th_ball_cam.png" },
    { name:"机器人搬运焊接工作站", fmt:"待补充", platform:"百度网盘", code:"bi11",
      url:"https://pan.baidu.com/s/14wd2DAzpoN_8pT45zaLzPw?pwd=bi11", img:"assets/th_robot.png" },
  ];

  const grid = document.getElementById("grid");
  models.forEach(m=>{
    const card = document.createElement("div");
    card.className = "card";
    const thumb = m.img
      ? `<div class="thumb"><span class="badge">${m.platform}</span><img src="${m.img}" alt="${m.name}" loading="lazy"/></div>`
      : `<div class="thumb"><span class="badge">${m.platform}</span><div class="ph">🖼️<br/>缩略图待补充</div></div>`;
    card.innerHTML = `
      ${thumb}
      <div class="body">
        <div class="name">${m.name}</div>
        <div class="tags">
          <span class="tag fmt">格式 ${m.fmt}</span>
          <span class="tag">${m.platform}</span>
        </div>
        <div class="code">提取码：<b>${m.code}</b></div>
        <a class="btn" href="${m.url}" target="_blank" rel="noopener">打开网盘 ↓</a>
      </div>`;
    grid.appendChild(card);
  });
  document.getElementById("count").textContent = "共 " + models.length + " 个模型";
</script>
</body>
</html>
