<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>机元镜像 · 三维模型库</title>
<style>
  :root{
    --bg:#f7f8fb; --bg2:#eef1f6; --card:#ffffff; --card2:#fbfcfe;
    --line:#e4e8ef; --text:#1f2733; --muted:#69738a; --accent:#0284c7; --accent2:#d97706;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 80% -10%,rgba(2,132,199,.05),transparent 60%),
      radial-gradient(900px 500px at -10% 10%,rgba(245,158,11,.05),transparent 55%),
      linear-gradient(180deg,#ffffff,var(--bg2));
    min-height:100vh; padding:0 0 56px;
  }
  header{
    max-width:1120px; margin:0 auto; padding:48px 24px 28px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:14px}
  .logo{
    width:46px;height:46px;border-radius:12px;flex:none;overflow:hidden;
    background:#fff;border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(15,23,42,.10);
  }
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  h1{font-size:26px;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .count{
    color:var(--muted);font-size:13px;border:1px solid var(--line);
    padding:8px 14px;border-radius:999px;background:#ffffff;
  }
  main{max-width:1120px;margin:0 auto;padding:8px 24px}
  .grid{
    display:grid;gap:20px;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  }
  .card{
    background:linear-gradient(180deg,var(--card),var(--card2));
    border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
    box-shadow:0 2px 10px rgba(15,23,42,.04);
  }
  .card:hover{transform:translateY(-4px);border-color:rgba(2,132,199,.45);box-shadow:0 14px 30px rgba(15,23,42,.12)}
  .thumb{position:relative;aspect-ratio:16/10;background:#eef2f7;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .ph{
    position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);
    background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 12px,#e8edf3 12px,#e8edf3 24px);
    font-size:13px;gap:8px;text-align:center;padding:18px;
  }
  .badge{
    position:absolute;top:10px;left:10px;font-size:12px;padding:4px 10px;border-radius:999px;
    background:rgba(255,255,255,.92);border:1px solid var(--line);backdrop-filter:blur(4px);color:#334155;
  }
  .body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
  .name{font-size:16px;font-weight:700;line-height:1.35}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:8px;background:#ffffff}
  .tag.fmt{color:#b45309;border-color:rgba(217,119,6,.4)}
  .code{font-size:13px;color:var(--muted);flex:none}
  .code b{color:var(--accent2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}
  .dl{display:flex;flex-direction:column;gap:8px;margin-top:auto}
  .dl-row{display:flex;align-items:center;gap:8px}
  .plat{font-size:12.5px;color:var(--muted);width:58px;flex:none}
  .mini-btn{
    flex:1;display:inline-flex;align-items:center;justify-content:center;
    text-decoration:none;color:#ffffff;font-weight:700;font-size:13px;
    background:linear-gradient(135deg,#0ea5e9,#22d3ee);
    padding:9px 10px;border-radius:9px;transition:filter .15s ease;
  }
  .mini-btn.alt{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#3d2800}
  .mini-btn:hover{filter:brightness(1.06)}
  .follow{max-width:1120px;margin:48px auto 0;padding:0 24px}
  .follow h2{font-size:20px;text-align:center}
  .follow-sub{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
  .qr-grid{
    display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    margin:24px 0 0;
  }
  .qr-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    transition:transform .18s ease,box-shadow .18s ease;box-shadow:0 2px 10px rgba(15,23,42,.04);
  }
  .qr-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(15,23,42,.10)}
  .qr-img{background:#ffffff;padding:14px;display:grid;place-items:center}
  .qr-img img{max-width:100%;max-height:190px;object-fit:contain;display:block}
  .qr-name{text-align:center;font-size:13.5px;font-weight:600;color:var(--text);padding:0 14px 14px}
  footer{
    max-width:1120px;margin:40px auto 0;padding:20px 24px;color:var(--muted);font-size:12.5px;line-height:1.7;
    border-top:1px solid var(--line);
  }
  footer b{color:#334155}
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo"><img src="assets/pig.jpg" alt="机元镜像"/></div>
      <div>
        <h1>三维模型库</h1>
        <div class="sub">机元镜像 · 自动化设备三维模型分享</div>
      </div>
    </div>
    <div class="count" id="count">共 6 个模型</div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <section class="follow">
    <h2>关注我们</h2>
    <div class="follow-sub">获取更多自动化资源与更新动态</div>
    <div class="qr-grid">
      <div class="qr-card">
        <div class="qr-img"><img src="assets/qr_mp.jpg" alt="微信公众号 自动化资源库" loading="lazy"/></div>
        <div class="qr-name">微信公众号 · 自动化资源库</div>
      </div>
      <div class="qr-card">
        <div class="qr-img"><img src="assets/qr_douyin.jpg" alt="抖音 机元镜像" loading="lazy"/></div>
        <div class="qr-name">抖音 · @机元镜像</div>
      </div>
      <div class="qr-card">
        <div class="qr-img"><img src="assets/qr_wechat_search.jpg" alt="微信搜一搜 机元镜像" loading="lazy"/></div>
        <div class="qr-name">微信搜一搜 · 机元镜像</div>
      </div>
    </div>
  </section>

  <footer>
    <p><b>版权与免责声明：</b>本页部分三维模型来源于互联网，仅用于学习交流与个人共享，相关权利归原作者所有。如涉及侵权，请联系维护人及时下架。请于下载后 24 小时内删除，由此产生的任何使用后果由使用者自行承担。</p>
  </footer>

<script>
  const models = [
    { name:"电池自动焊锡设备", fmt:"STEP", code:"bi33",
      url:"https://pan.baidu.com/s/17XPuTToQvsIJGyHswVGiJw?pwd=bi33",
      pan123:{ url:"https://1860092132.share.123pan.cn/123pan/T6lzvd-9XC1H?pwd=6CGj", code:"6CGj" },
      img:"assets/th1.jpg" },
    { name:"电池包检测自动上下料", fmt:"STEP", code:"bi22",
      url:"https://pan.baidu.com/s/1cYYgjNgMh67li1Ish6fBhg?pwd=bi22",
      pan123:{ url:"https://1860092132.share.123pan.cn/123pan/T6lzvd-tzq1H?pwd=mhXT", code:"mhXT" },
      img:"assets/th2.jpg" },
    { name:"智能分拣设备", fmt:"STEP", code:"bi11",
      url:"https://pan.baidu.com/s/1cOmCpZeYMgmpR4RhVywxSg?pwd=bi11",
      pan123:{ url:"https://1860092132.share.123pan.cn/123pan/T6lzvd-1qoxH?pwd=AS22", code:"AS22" },
      img:"assets/th3.jpg" },
    { name:"小球自动装罐机", fmt:"STEP", code:"bi11",
      url:"https://pan.baidu.com/s/1kzv5DyBhQAwBsHHyd_Fa_w?pwd=bi11",
      pan123:{ url:"https://1860092132.share.123pan.cn/123pan/T6lzvd-WK34H?pwd=AS33", code:"AS33" },
      img:"assets/th_ball_can.jpg" },
    { name:"小球凸轮搬运", fmt:"STEP", code:"bi11",
      url:"https://pan.baidu.com/s/1vkaHbW3eT7SaYGDwMbqE4Q?pwd=bi11",
      pan123:{ url:"https://1860092132.share.123pan.cn/123pan/T6lzvd-haB4H?pwd=LbLj", code:"LbLj" },
      img:"assets/th_ball_cam.jpg" },
    { name:"机器人搬运焊接工作站", fmt:"STEP", code:"bi11",
      url:"https://pan.baidu.com/s/14wd2DAzpoN_8pT45zaLzPw?pwd=bi11",
      pan123:{ url:"https://1860092132.share.123pan.cn/123pan/T6lzvd-AXC1H?pwd=rjEl", code:"rjEl" },
      img:"assets/th_robot.jpg" },
  ];

  const grid = document.getElementById("grid");
  models.forEach(m=>{
    const card = document.createElement("div");
    card.className = "card";
    const thumb = m.img
      ? `<div class="thumb"><span class="badge">${m.fmt}</span><img src="${m.img}" alt="${m.name}" loading="lazy"/></div>`
      : `<div class="thumb"><span class="badge">${m.fmt}</span><div class="ph">🖼️<br/>缩略图待补充</div></div>`;
    card.innerHTML = `
      ${thumb}
      <div class="body">
        <div class="name">${m.name}</div>
        <div class="dl">
          <div class="dl-row">
            <span class="plat">百度网盘</span>
            <a class="mini-btn" href="${m.url}" target="_blank" rel="noopener">打开下载</a>
            <span class="code">提取码 <b>${m.code}</b></span>
          </div>
          ${m.pan123 ? `
          <div class="dl-row">
            <span class="plat">123网盘</span>
            <a class="mini-btn alt" href="${m.pan123.url}" target="_blank" rel="noopener">打开下载</a>
            <span class="code">提取码 <b>${m.pan123.code}</b></span>
          </div>` : ""}
        </div>
      </div>`;
    grid.appendChild(card);
  });
  document.getElementById("count").textContent = "共 " + models.length + " 个模型";
</script>
</body>
</html>
